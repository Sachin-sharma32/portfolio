<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>404 — Page not found · Sachin Sharma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0a0a0a;
        --paper: #f5f5f0;
        --cyan: #22d3ee;
        --line: #232323;
        --muted: #8a8a8a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background-color: var(--ink);
        color: var(--paper);
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background-image:
          linear-gradient(to right, #161616 1px, transparent 1px),
          linear-gradient(to bottom, #161616 1px, transparent 1px);
        background-size: 64px 64px;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
      }
      ::selection {
        background: var(--cyan);
        color: var(--ink);
      }
      .frame {
        border: 1px solid var(--cyan);
        max-width: 760px;
        width: 100%;
        padding: clamp(28px, 6vw, 64px);
        position: relative;
      }
      .label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--cyan);
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      h1 {
        font-size: clamp(5rem, 22vw, 13rem);
        line-height: 0.82;
        letter-spacing: -0.04em;
        font-weight: 700;
      }
      h1 .stroke {
        color: transparent;
        -webkit-text-stroke: 2px var(--cyan);
      }
      p {
        font-family: 'JetBrains Mono', monospace;
        color: var(--muted);
        margin-top: 28px;
        max-width: 46ch;
        line-height: 1.7;
        font-size: 0.95rem;
      }
      .actions {
        margin-top: 36px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a.btn {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 13px 22px;
        border: 1px solid var(--line);
        color: var(--paper);
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }
      a.btn.primary {
        border-color: var(--cyan);
        background: var(--cyan);
        color: var(--ink);
      }
      a.btn:hover {
        transform: translate(-2px, -2px);
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: 4px 4px 0 0 var(--cyan);
      }
      a.btn.primary:hover {
        color: var(--ink);
        box-shadow: 4px 4px 0 0 var(--paper);
      }
      .corner {
        position: absolute;
        top: 16px;
        right: 20px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <span class="corner">ERR_NO_ROUTE</span>
      <div class="label">404 / lost the thread</div>
      <h1>4<span class="stroke">0</span>4</h1>
      <p>
        This page took a wrong turn — broken link, old URL, or a typo. The code compiles; the route
        just doesn't exist. Let's get you back on track.
      </p>
      <div class="actions">
        <a class="btn primary" id="home" href="/portfolio/">← Back to index</a>
        <a class="btn" href="mailto:sachin2sharma001@gmail.com">Report it</a>
      </div>
    </main>
    <script>
      // Works on any GitHub Pages project site: link home to /<repo>/ derived
      // from the current path, falling back to root for user/custom domains.
      (function () {
        var seg = location.pathname.split('/').filter(Boolean)[0];
        document.getElementById('home').setAttribute('href', seg ? '/' + seg + '/' : '/');
      })();
    </script>
  </body>
</html>
